services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdip}
      POSTGRES_DB: ${POSTGRES_DB:-sdip}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sdip}:${POSTGRES_PASSWORD:-sdip}@postgres:5432/${POSTGRES_DB:-sdip}
      AI_API_KEY: ${AI_API_KEY:-}
      EMAIL_ADAPTER: local
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      SEED_DEMO_ACCOUNT: ${SEED_DEMO_ACCOUNT:-true}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:8100/reset-password}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:8100}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8100:8000"
    volumes:
      - media_data:/app/backend/media-storage
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9-alpine
    profiles: [aws]
    depends_on:
      - app
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:-dev.localhost}
      PROD_DOMAIN: ${PROD_DOMAIN:-localhost}
      PROD_UPSTREAM: ${PROD_UPSTREAM:-127.0.0.1:8101}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/ec2/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
    name: interview-canvas-pgdata
  media_data:
    name: interview-canvas-media
  caddy_data:
    name: interview-canvas-caddy-data
  caddy_config:
    name: interview-canvas-caddy-config
