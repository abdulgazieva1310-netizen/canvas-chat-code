openapi: 3.0.3
info:
  title: Interview Mirror — Frontend API Contract
  version: 0.0.0
  description: |
    The frontend currently uses an asynchronous mock service defined in
    frontend/src/lib/api/mock-api.ts, with entity types in types.ts.
    Setup, interview, report, lobby, and session history call this mock service.
    It simulates latency and stores interview sessions in browser sessionStorage;
    it does not make HTTP requests or implement real authentication.

    HTTP endpoint methods, paths, request/response payloads, and authentication
    transport have not yet been defined. The empty paths object is intentional
    until the mock service is used to design the backend API contract.

    The URLs /, /setup, /ready, /interview, and /report are frontend page routes,
    not backend API endpoints. docs/spec.md describes planned product features,
    including required accounts, but does not define their HTTP contract.
paths: {}
