name: interview-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      # Only OTLP/HTTP is published on the host. Deployed Dev security-group
      # ingress restricts this port to the Dev and Production app hosts.
      - "${OTEL_BIND_ADDRESS:-127.0.0.1}:4318:4318"
    depends_on:
      - loki
      - tempo
    mem_limit: 96m
    memswap_limit: 256m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    mem_limit: 160m
    memswap_limit: 320m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 96m
    memswap_limit: 256m
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 96m
    memswap_limit: 256m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-sharing}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    # Grafana 13 uses about 120 MiB during first-start provisioning. Leave
    # room for its startup peak on the existing 1 GiB Dev host.
    mem_limit: 192m
    memswap_limit: 384m
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
