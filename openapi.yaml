openapi: 3.0.3
info:
  title: Interview Mirror API
  version: 1.0.0
  description: |
    Backend contract derived from frontend/src/lib/api/types.ts and mock-api.ts.
    The frontend HTTP client uses these paths, status codes, error envelopes,
    and cookie authentication.
    Successful JSON bodies match the mock's return values directly, without wrappers.
    All interview operations require a session and access only the current user's data.
    Login and registration establish that session. No token field is added to User.
    Voice input submits browser-transcribed text. Audio uploads, streaming, and
    dashboard statistics have no client operations.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: Authenticate and establish a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 1, writeOnly: true}
      responses:
        '200':
          description: Authenticated user
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      operationId: register
      summary: Create a user and establish a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterData'
      responses:
        '201':
          description: Registered user
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      operationId: getProfile
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Current user (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateProfile
      summary: Update the authenticated user's name and interview preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Saved user profile (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke supplied session tokens and clear the browser cookie
      description: Idempotent, including when credentials have expired. Revokes both the bearer token and session cookie token when supplied. Other device sessions remain active.
      security: []
      responses:
        '204':
          description: Session revoked and session cookie expired at path /api; no response body
  /interviews:
    post:
      operationId: startInterview
      summary: Start an interview
      description: Returns an active interview with its first AI question, zero answers, and null endedAt and lastFeedback. Saves the selected role and level as the authenticated user's profile preferences in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewSetup'
      responses:
        '201':
          $ref: '#/components/responses/InterviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: getHistory
      summary: Get saved interview history
      description: Returns complete and incomplete interviews only, newest startedAt first. Returns an empty array when none exist. No request body or query parameters.
      responses:
        '200':
          description: Current user's ended interviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interview'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /interviews/{interviewId}:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    get:
      operationId: getInterview
      summary: Get an interview including its messages
      description: No request body.
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteInterview
      summary: Delete an interview and its saved data
      description: |
        Permanently deletes the owner's interview, transcript/messages, and answer
        evaluations in one transaction. Missing and inaccessible interviews return
        404. Works for active, incomplete, and complete interviews. No request body.
      responses:
        '204':
          description: Interview deleted; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /interviews/{interviewId}/resume:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    post:
      operationId: resumeInterview
      summary: Resume an incomplete interview
      description: |
        Changes incomplete to active and clears endedAt, preserving the ID, setup,
        transcript, answer count, pending question, and stored evaluations. Already
        active interviews are returned unchanged. Completed interviews return 409.
        No request body. Inaccessible interviews return 404.
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /interviews/{interviewId}/messages:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    post:
      operationId: sendMessage
      summary: Submit an answer and advance the interview
      description: |
        Rejects empty answers. Preserves source whitespace for supported coding roles in Technical
        submissions and trims other answers. Reviews code in the selected language using
        static AI analysis without execution. Appends the user's message and increments
        answeredCount. Appends the next AI question unless questionCount is reached,
        when status becomes complete and endedAt is set. Practice mode returns live
        lastFeedback scores and lastAnswerFeedback text when evaluation succeeds;
        Real Interview mode keeps both null. Unavailable evaluations return null feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  pattern: '\S'
                selectedLanguage:
                  type: string
                  enum: [Python, Java, C++, JavaScript, TypeScript]
                  description: Language for technical code evaluation; omitted values use the role default.
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /interviews/{interviewId}/hint:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    post:
      operationId: getHint
      summary: Append a coaching hint
      description: Only allowed for active Practice interviews. Generates a question-specific Groq hint using the current problem, prior hints for that problem, role, level, and type. Saves the hint message and returns the updated interview without advancing the question. Missing keys or generation failures append a temporary-unavailability notice. No request body.
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /interviews/{interviewId}/end:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    post:
      operationId: endInterview
      summary: End an interview early
      description: Sets an active interview to incomplete and records endedAt. Already ended interviews are returned unchanged, including complete status. No request body.
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /interviews/{interviewId}/report:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    get:
      operationId: getReport
      summary: Get feedback for an ended interview
      description: |
        Requires complete or incomplete status. With no answers, overall and scores
        are null and strengths, gaps, and questions are empty arrays. Otherwise,
        questions contains feedback for each submitted answer. Category and overall scores
        average only successfully evaluated answers. Answers without evaluation have
        null score/scores and an unavailable notice; overall and scores are null when
        none were evaluated. Stored evaluations are reused; this endpoint does not call AI.
        No request body.
      responses:
        '200':
          description: Interview and its feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie established by login or registration; required for every interview operation.
  headers:
    SessionCookie:
      description: Establishes an HttpOnly session cookie (Secure in production).
      schema:
        type: string
        example: session=opaque-session-id; Path=/api; HttpOnly; Secure; SameSite=Lax
  parameters:
    InterviewId:
      name: interviewId
      in: path
      required: true
      description: Opaque interview identifier returned by startInterview.
      schema:
        type: string
  responses:
    InterviewResult:
      description: Full interview state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Interview'
    BadRequest:
      description: Missing or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Invalid login credentials or missing/expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Interview does not exist or is not accessible to the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidState:
      description: Operation is unavailable in the interview's current status or mode
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Role:
      type: string
      enum: [Frontend Developer, Backend Developer, Full Stack Developer, Java Developer, Python Developer, C++ Developer, QA Engineer, Data Analyst, DevOps Engineer]
    Level:
      type: string
      enum: [Junior, Middle, Senior]
    User:
      type: object
      required: [id, name, email, targetRole, level, preferredLanguage]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        targetRole:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/Level'
        preferredLanguage: {type: string, enum: [English]}
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [name, targetRole, level]
      properties:
        name: {type: string, minLength: 1, pattern: '\S'}
        targetRole:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/Level'
    RegisterData:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 1, pattern: '\S'}
        email: {type: string, format: email}
        password: {type: string, minLength: 1, writeOnly: true}
        targetRole:
          description: Defaults to Frontend Developer when omitted.
          allOf:
            - $ref: '#/components/schemas/Role'
        level:
          description: Defaults to Middle when omitted.
          allOf:
            - $ref: '#/components/schemas/Level'
    InterviewSetup:
      type: object
      required: [role, level, mode, questionCount, type, input, language]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/Level'
        mode: {type: string, enum: [Practice, Real Interview]}
        questionCount: {type: integer, enum: [5, 10, 15]}
        type: {type: string, enum: [Technical, Behavioral, Role-specific]}
        input: {type: string, enum: [Voice, Text]}
        language: {type: string, enum: [English]}
        jobDescription: {type: string}
    Message:
      type: object
      required: [id, interviewId, from, text, createdAt]
      properties:
        id: {type: string}
        interviewId: {type: string}
        from: {type: string, enum: [ai, you, hint]}
        text: {type: string}
        createdAt: {type: string, format: date-time}
    Scores:
      type: object
      required: [accuracy, completeness, clarity, structure]
      properties:
        accuracy: {type: number, minimum: 1, maximum: 10}
        completeness: {type: number, minimum: 1, maximum: 10}
        clarity: {type: number, minimum: 1, maximum: 10}
        structure: {type: number, minimum: 1, maximum: 10}
    AnswerEvaluation:
      allOf:
        - $ref: '#/components/schemas/Scores'
        - type: object
          required: [went_well, missing, stronger_answer]
          properties:
            went_well: {type: string}
            missing: {type: string}
            stronger_answer: {type: string}
    Interview:
      type: object
      required: [id, setup, status, startedAt, endedAt, answeredCount, messages, lastFeedback]
      properties:
        id: {type: string}
        setup:
          $ref: '#/components/schemas/InterviewSetup'
        status: {type: string, enum: [active, complete, incomplete]}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time, nullable: true}
        answeredCount: {type: integer, minimum: 0}
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        lastFeedback:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Scores'
        lastAnswerFeedback:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AnswerEvaluation'
    Feedback:
      type: object
      required: [interviewId, overall, scores, strengths, gaps, questions]
      properties:
        interviewId: {type: string}
        overall: {type: number, nullable: true}
        scores:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Scores'
        strengths:
          type: array
          items: {type: string}
        gaps:
          type: array
          items: {type: string}
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionFeedback'
    QuestionFeedback:
      type: object
      required: [q, answer, score, good, miss, better]
      properties:
        q: {type: string}
        answer: {type: string}
        score: {type: number, nullable: true}
        scores:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Scores'
        good: {type: string}
        miss: {type: string}
        better: {type: string}
    InterviewReport:
      type: object
      required: [interview, feedback]
      properties:
        interview:
          $ref: '#/components/schemas/Interview'
        feedback:
          $ref: '#/components/schemas/Feedback'
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable error suitable for display by the client.
