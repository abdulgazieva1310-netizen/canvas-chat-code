[project]
name = "interview-mirror-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic[email]>=2.9,<3",
    "pwdlib[argon2]>=0.2,<1",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "alembic>=1.13,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "jsonschema>=4,<5",
    "openapi-spec-validator>=0.7,<0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
