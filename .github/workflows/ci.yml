name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull request checks, but let push checks finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --project backend
      - run: uv run --locked --project backend pytest backend/tests
      - run: uv run --locked --project backend python -m pytest coding-runner/test_runner.py

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  compose:
    name: Docker Compose integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_API_KEY: ''
      EMAIL_ADAPTER: local
      COMPOSE_APP_URL: http://localhost:8100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --project backend
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start Compose stack
        run: docker compose up --build --detach
      - name: Run PostgreSQL and API integration tests
        env:
          COMPOSE_INTEGRATION: '1'
        run: uv run --locked --project backend pytest backend/tests/integration/test_compose_stack.py -q
      - name: Run browser E2E against Compose
        run: npm run test:e2e:compose --prefix frontend
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-failure-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            frontend/test-results/
            frontend/playwright-report/
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  journeys:
    name: Full browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_API_KEY: ''
      EMAIL_ADAPTER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --project backend
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: uv run --locked --project backend python scripts/journey.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-journey-failure-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/journey-servers.log

  build-image:
    name: Build and publish immutable ECR image
    if: github.event_name == 'push'
    needs: [backend, frontend, compose, journeys]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      ECR_REPOSITORY: interview-mirror-app
    outputs:
      image_uri: ${{ steps.publish.outputs.image_uri }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image tagged with UTC timestamp and short SHA
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          repository_uri="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          image_tag="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          image_uri="${repository_uri}:${image_tag}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$image_uri" \
            --push \
            .
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  deploy-dev:
    name: Deploy published image to Dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      AWS_STACK_NAME: interview-mirror-staging
      IMAGE_URI: ${{ needs.build-image.outputs.image_uri }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find Dev instance
        id: target
        shell: bash
        run: |
          set -euo pipefail
          instance_id="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationInstanceId'].OutputValue | [0]" \
            --output text)"
          if [[ -z "$instance_id" || "$instance_id" == "None" ]]; then
            echo "Could not find ApplicationInstanceId in stack $AWS_STACK_NAME" >&2
            exit 1
          fi
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
      - name: Pull and run the exact published image through Systems Manager
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          parameters="$(jq -cn --arg image "$IMAGE_URI" --arg registry "${IMAGE_URI%%:*}" --arg region "$AWS_REGION" \
            '{commands: ["git -C /opt/interview-mirror/repo fetch --depth=1 origin dev", "git -C /opt/interview-mirror/repo reset --hard FETCH_HEAD", "sed -i \"/APP_IMAGE=/d\" /opt/interview-mirror/runtime.env", "printf \"APP_IMAGE=%s\\\\n\" " + $image + " >> /opt/interview-mirror/runtime.env", "aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry, "docker compose --env-file /opt/interview-mirror/runtime.env pull app", "docker compose --env-file /opt/interview-mirror/runtime.env up -d --no-build --pull never app"]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy image to Dev" \
            --parameters "$parameters" \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)"
          status="Pending"
          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) break ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" --region "$AWS_REGION" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text || true
                exit 1 ;;
              Pending|InProgress|Delayed|"") sleep 10 ;;
              *) echo "Unexpected SSM command status: $status" >&2; exit 1 ;;
            esac
          done
          if [[ "$status" != "Success" ]]; then
            echo "Timed out waiting for Dev deployment $command_id (last status: $status)" >&2
            exit 1
          fi
      - name: Verify Dev health
        shell: bash
        run: |
          set -euo pipefail
          application_ip="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationPublicIp'].OutputValue | [0]" \
            --output text)"
          curl --fail --show-error --retry 18 --retry-delay 10 --retry-connrefused \
            "https://dev.${application_ip}.nip.io/api/health"

