[project]
name = "interview-mirror-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic[email]>=2.9,<3", "pwdlib[argon2]>=0.2,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pyyaml>=6,<7", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
