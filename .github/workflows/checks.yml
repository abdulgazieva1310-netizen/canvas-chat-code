name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # Let an active main-branch deploy finish before a newer push queues.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --project backend
      - run: uv run --locked --project backend pytest backend/tests
      - run: uv run --locked --project backend python -m pytest coding-runner/test_runner.py

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  compose:
    name: Docker Compose integration and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_API_KEY: ''
      EMAIL_ADAPTER: local
      COMPOSE_APP_URL: http://localhost:8100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --project backend
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start Compose stack
        run: docker compose up --build --detach
      - name: Run PostgreSQL and API integration tests
        env:
          COMPOSE_INTEGRATION: '1'
        run: uv run --locked --project backend pytest backend/tests/integration/test_compose_stack.py -q
      - name: Run browser E2E against Compose
        run: npm run test:e2e:compose --prefix frontend
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-e2e-failure-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            frontend/test-results/
            frontend/playwright-report/
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  journeys:
    name: Full browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_API_KEY: ''
      EMAIL_ADAPTER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --project backend
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: uv run --locked --project backend python scripts/journey.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-journey-failure-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/journey-servers.log

  deploy:
    name: Deploy to EC2 via SSM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, compose, journeys]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      AWS_STACK_NAME: interview-mirror-staging
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the EC2 instance
        id: target
        shell: bash
        run: |
          set -euo pipefail
          instance_id="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationInstanceId'].OutputValue | [0]" \
            --output text)"
          if [[ -z "$instance_id" || "$instance_id" == "None" ]]; then
            echo "Could not find ApplicationInstanceId in stack $AWS_STACK_NAME" >&2
            exit 1
          fi
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Deploy main on EC2 through Systems Manager
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA} from GitHub Actions" \
            --parameters 'commands=["cd /opt/interview-mirror/repo && git fetch --depth=1 origin main && git reset --hard FETCH_HEAD && docker compose --env-file /opt/interview-mirror/runtime.env --profile aws up -d --build --remove-orphans"]' \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)"
          echo "Started SSM deployment $command_id on $INSTANCE_ID"

          status="Pending"
          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success)
                echo "SSM deployment completed successfully"
                break
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '[StandardOutputContent,StandardErrorContent]' \
                  --output text || true
                exit 1
                ;;
              Pending|InProgress|Delayed|"")
                sleep 10
                ;;
              *)
                echo "Unexpected SSM command status: $status" >&2
                exit 1
                ;;
            esac
          done
          if [[ "$status" != "Success" ]]; then
            echo "Timed out waiting for SSM deployment $command_id (last status: $status)" >&2
            exit 1
          fi

      - name: Verify public application health
        shell: bash
        run: |
          set -euo pipefail
          application_ip="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationPublicIp'].OutputValue | [0]" \
            --output text)"
          application_url="https://dev.${application_ip}.nip.io"
          curl --fail --show-error --retry 18 --retry-delay 10 --retry-connrefused \
            "$application_url/api/health"
