openapi: 3.0.3
info:
  title: Interview Mirror API
  version: 1.0.0
  description: |
    Backend contract derived from frontend/src/lib/api/types.ts and mock-api.ts.
    The frontend HTTP client uses these paths, status codes, error envelopes,
    and cookie authentication.
    Successful JSON bodies match the mock's return values directly, without wrappers.
    All interview operations require a session and access only the current user's data.
    Login and registration establish that session. No token field is added to User.
    Voice input submits browser-transcribed text. No raw audio is stored.
    Operations marked x-implementation-status: planned are handoff contracts,
    not currently served endpoints. Existing history returns an array until #40
    migrates all consumers to the documented x-planned-contract envelope.
    Nullable category scores in PlannedScores represent unavailable or inapplicable
    categories and are excluded from averages; an empty average is null. All scores
    are approximate AI coaching estimates. Missing and inaccessible IDs both return 404.
servers:
  - url: /api
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request an expiring recovery link without disclosing account existence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '202':
          description: Same response for known and unknown accounts, including delivery failures
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Replace password and revoke existing sessions using a single-use recovery token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
                password: {type: string, minLength: 1, writeOnly: true}
      responses:
        '204':
          description: Password replaced; all existing sessions and recovery links revoked
        '400':
          description: Invalid input or invalid, expired, or previously consumed link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate and establish a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 1, writeOnly: true}
      responses:
        '200':
          description: Authenticated user
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      operationId: register
      summary: Create a user and establish a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterData'
      responses:
        '201':
          description: Registered user
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/me:
    get:
      operationId: getProfile
      summary: Get the authenticated user's profile
      responses:
        '200':
          description: Current user (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateProfile
      summary: Update the authenticated user's name and interview preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Saved user profile (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: deleteAccount
      summary: Permanently delete the current account after password reauthentication
      description: Removes owned database records transactionally, revokes all sessions/reset links and expires the cookie. Private media becomes inaccessible immediately; durable file cleanup is attempted after commit and retried every minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirmation]
              properties:
                password: {type: string, minLength: 1, writeOnly: true}
                confirmation: {type: string, enum: [DELETE]}
      responses:
        '204': {description: Account deleted; file cleanup may remain queued}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke supplied session tokens and clear the browser cookie
      description: Idempotent, including when credentials have expired. Revokes both the bearer token and session cookie token when supplied. Other device sessions remain active.
      security: []
      responses:
        '204':
          description: Session revoked and session cookie expired at path /api; no response body
  /interviews:
    post:
      operationId: startInterview
      summary: Start an interview
      description: Creates an active interview with its first question without changing saved profile preferences. Retrying with the same owner-scoped Idempotency-Key and configuration returns the existing interview's current state. Different configuration or a deleted interview under the same key returns 409.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: {type: string, minLength: 1, maxLength: 128}
          description: Reuse for retries of one start attempt; use a new key for a new interview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewSetup'
      responses:
        '201':
          $ref: '#/components/responses/InterviewResult'
        '409':
          description: Start key reused with different configuration or after interview deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: getHistory
      summary: Get saved interview history
      description: Returns owner-scoped complete and incomplete interviews in a page envelope. Filters combine with AND. Order is startedAt descending then ID ascending. Date bounds are inclusive UTC calendar days; search is a case-insensitive substring over role and optional job description. Unscored sessions remain unless score bounds are supplied. Invalid pages or ranges return 400.
      x-implementation-status: implemented
      parameters:
        - in: query
          name: role
          schema: {$ref: '#/components/schemas/Role'}
        - in: query
          name: type
          schema: {type: string, enum: [Technical, Behavioral, Role-specific]}
        - in: query
          name: startDate
          schema: {type: string, format: date}
        - in: query
          name: endDate
          schema: {type: string, format: date}
        - in: query
          name: minScore
          schema: {type: number, minimum: 1, maximum: 10}
        - in: query
          name: maxScore
          schema: {type: number, minimum: 1, maximum: 10}
        - in: query
          name: search
          schema: {type: string, maxLength: 200}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: pageSize
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Current user's ended interviews and owner-scoped total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /interviews/{interviewId}:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    get:
      operationId: getInterview
      summary: Get an interview including its messages
      description: No request body.
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteInterview
      summary: Delete an interview and its saved data
      description: |
        Permanently deletes the owner's interview, transcript/messages, and answer
        evaluations in one transaction. Missing and inaccessible interviews return
        404. Works for active, incomplete, and complete interviews. No request body.
      responses:
        '204':
          description: Interview deleted; no response body
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /interviews/{interviewId}/resume:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    post:
      operationId: resumeInterview
      summary: Resume an incomplete interview
      description: |
        Changes incomplete to active and clears endedAt, preserving the ID, setup,
        transcript, answer count, pending question, and stored evaluations. Already
        active interviews are returned unchanged. Completed interviews return 409.
        No request body. Inaccessible interviews return 404.
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /interviews/{interviewId}/run:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    post:
      operationId: runCode
      summary: Run code in the isolated coding runner
      description: Runs bounded source in a disposable, network-disabled container only for the authenticated owner's active technical coding interview. This does not submit an answer or change interview state. If the runner is unavailable, the response says so and static AI review remains available through sendMessage.
      x-implementation-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRunRequest'
      responses:
        '200':
          description: Bounded compile/runtime result, or an explicit runner-unavailable result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /interviews/{interviewId}/messages:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    post:
      operationId: sendMessage
      summary: Submit an answer and advance the interview
      description: |
        Rejects empty answers. Clients send expectedQuestionId for the pending question; an exact
        retry returns the already persisted interview unchanged, while stale or competing submissions
        return 409. Preserves source whitespace for supported coding roles in Technical
        submissions and trims other answers. Reviews code in the selected language using
        static AI analysis without execution. Appends the user's message and increments
        answeredCount. Appends the next AI question unless questionCount is reached,
        when status becomes complete and endedAt is set. Practice mode returns live
        lastFeedback scores and lastAnswerFeedback text when evaluation succeeds;
        Real Interview mode keeps both null. Unavailable evaluations return null feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  pattern: '\S'
                selectedLanguage:
                  type: string
                  enum: [Python, Java, C++, JavaScript, TypeScript]
                  description: Language for technical code evaluation; omitted values use the role default.
                expectedQuestionId:
                  type: string
                  minLength: 1
                  description: ID of the pending AI question being answered; used to reject stale submissions and make exact retries idempotent.
            examples:
              text:
                $ref: '#/components/examples/TextAnswer'
              code:
                $ref: '#/components/examples/CodeAnswer'
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /interviews/{interviewId}/hint:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    post:
      operationId: getHint
      summary: Append a coaching hint
      description: Only allowed for active Practice interviews. Generates a question-specific Groq hint using the current problem, prior hints for that problem, role, level, and type. Saves the hint message and returns the updated interview without advancing the question. Missing keys or generation failures append a temporary-unavailability notice. No request body.
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /interviews/{interviewId}/end:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    post:
      operationId: endInterview
      summary: End an interview early
      description: Sets an active interview to incomplete and records endedAt. Already ended interviews are returned unchanged, including complete status. No request body.
      responses:
        '200':
          $ref: '#/components/responses/InterviewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /interviews/{interviewId}/report:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    get:
      operationId: getReport
      summary: Get feedback for an ended interview
      description: |
        Requires complete or incomplete status. With no answers, overall and scores
        are null and strengths, gaps, and questions are empty arrays. Otherwise,
        questions contains feedback for each submitted answer. Category and overall scores
        average only successfully evaluated answers. Answers without evaluation have
        null score/scores and an unavailable notice; overall and scores are null when
        none were evaluated. Stored evaluations are reused; this endpoint does not call AI.
        No request body.
      responses:
        '200':
          description: Interview and its feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewReport'
              examples:
                earlyEnded:
                  $ref: '#/components/examples/EarlyEndedReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
  /interviews/{interviewId}/report/export:
    parameters:
      - $ref: '#/components/parameters/InterviewId'
    get:
      operationId: exportReport
      summary: Download a saved report as Markdown
      description: Owner-scoped, read-only saved transcript and feedback. Active sessions return 409. No AI calls or raw media. Unicode and code formatting are preserved.
      responses:
        '200':
          description: Markdown attachment with a safe date-based filename
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            text/markdown:
              schema: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Missing or inaccessible interview
        '409':
          description: Interview is still active
  /auth/me/export:
    get:
      operationId: exportAccount
      summary: Download an owner-scoped versioned JSON account archive
      description: Consistent read snapshot. Includes public profile, sessions, evaluations, learning plan, study notes and media metadata; excludes credentials, hidden judge cases, storage paths and raw media. No provider calls. Active Real Interviews must end first. Maximum 10 MiB.
      responses:
        '200':
          description: JSON archive attachment
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, exportedAt, profile, interviews, evaluations, learningPlan, studyQuestions, media, mediaBytesIncluded]
                properties:
                  schemaVersion: {type: integer, enum: [1]}
                  exportedAt: {type: string, format: date-time}
                  profile: {$ref: '#/components/schemas/User'}
                  interviews:
                    type: array
                    items: {$ref: '#/components/schemas/Interview'}
                  evaluations:
                    type: array
                    items: {type: object}
                  learningPlan: {$ref: '#/components/schemas/DashboardSummary'}
                  studyQuestions:
                    type: array
                    items: {type: object}
                  media:
                    type: array
                    items: {type: object}
                  mediaBytesIncluded: {type: boolean, enum: [false]}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409': {description: Active Real Interview would expose feedback prematurely}
        '413': {description: Archive exceeds 10 MiB; no partial attachment returned}
  /study/questions:
    get:
      operationId: listStudyQuestions
      summary: List private saved questions
      parameters:
        - {in: query, name: page, schema: {type: integer, minimum: 1, default: 1}}
        - {in: query, name: pageSize, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Owner-scoped questions ordered by savedAt descending then ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudyPage'}
    post:
      operationId: saveStudyQuestion
      summary: Idempotently save an answered question from an ended report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interviewId, questionId]
              properties:
                interviewId: {type: string, minLength: 1}
                questionId: {type: string, minLength: 1}
      responses:
        '200':
          description: Existing or newly saved question; existing note retained
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudyQuestion'}
        '404': {description: Missing or inaccessible reported question}
        '409': {description: Interview is active}
  /study/questions/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string}}
    patch:
      operationId: updateStudyNote
      summary: Update an owned plain-text note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: {type: string, maxLength: 4000}
      responses:
        '200':
          description: Updated saved question
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StudyQuestion'}
        '404': {description: Missing or inaccessible saved question}
    delete:
      operationId: removeStudyQuestion
      summary: Remove an owned saved question
      responses:
        '204': {description: Removed}
        '404': {description: Missing or inaccessible saved question}
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      x-implementation-status: implemented
      summary: Get the current user's dashboard summary
      description: Owner-scoped. Counts include all completed interviews; averages and trends include only completed scored sessions grouped by role, type, mode, and starting level. Recent activity includes labeled incomplete sessions. Null averages and empty trends represent insufficient data. Recurring claims require multiple source answers; suggestions carry those references. Each group includes its own recommendations, requiring the same topic in at least two completed scored interviews within that exact role/type/mode/starting-level group. Top-level suggestions remain an account-wide compatibility summary and must not drive a selected-group learning plan. New completions and deletions appear on the next read. Order activity by startedAt descending then ID; trend points by date then interviewId.
      responses:
        '200':
          description: Personal summary with compatible comparison groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  examples:
    TextAnswer:
      x-schema: AnswerSubmission
      value:
        text: I would first reproduce the incident, inspect logs, and verify a fix against the original failure.
    CodeAnswer:
      x-schema: AnswerSubmission
      value:
        text: "def two_sum(nums, target):\n    seen = {}\n    for i, value in enumerate(nums):\n        if target - value in seen:\n            return [seen[target - value], i]\n        seen[value] = i\n"
        selectedLanguage: Python
    CodeRun:
      x-schema: CodeRunRequest
      value:
        language: Python
        code: "print(42)"
    FollowUp:
      x-schema: PlannedMessage
      value:
        id: follow-up-1
        interviewId: partial-1
        from: ai
        text: How would you verify that the fix addressed the original failure?
        createdAt: '2026-10-19T10:02:00Z'
        kind: follow-up
        mainQuestionId: main-1
        mainQuestionNumber: 1
    EarlyEndedReport:
      x-schema: InterviewReport
      value:
        interview:
          id: partial-1
          setup:
            role: QA Engineer
            level: Junior
            mode: Real Interview
            questionCount: 5
            type: Role-specific
            input: Text
            language: English
            jobDescription: ''
          status: incomplete
          startedAt: '2026-10-19T10:00:00Z'
          endedAt: '2026-10-19T10:03:00Z'
          answeredCount: 1
          messages:
            - id: main-1
              interviewId: partial-1
              from: ai
              text: How would you investigate a reported defect?
              createdAt: '2026-10-19T10:00:00Z'
            - id: answer-1
              interviewId: partial-1
              from: you
              text: I would reproduce the defect and inspect the logs.
              createdAt: '2026-10-19T10:01:00Z'
          lastFeedback: null
          lastAnswerFeedback: null
        feedback:
          interviewId: partial-1
          answeredQuestions: 1
          selectedQuestions: 5
          overall: null
          scores: null
          strengths: []
          gaps: []
          questions:
            - q: How would you investigate a reported defect?
              questionId: question-1
              answerId: answer-1
              answer: I would reproduce the defect and inspect the logs.
              score: null
              scores: null
              good: Evaluation unavailable.
              miss: No reliable evaluation is available for this answer.
              better: Try again later for coaching.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque expiring server-validated token returned in the Authorization response header. Only token digests are stored. An invalid explicit Authorization header takes precedence over cookies.
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie established by login or registration; required for every interview operation.
  headers:
    SessionCookie:
      description: Establishes an HttpOnly session cookie (Secure in production).
      schema:
        type: string
        example: session=opaque-session-id; Path=/api; HttpOnly; Secure; SameSite=Lax
  parameters:
    InterviewId:
      name: interviewId
      in: path
      required: true
      description: Opaque interview identifier returned by startInterview.
      schema:
        type: string
  responses:
    InterviewResult:
      description: Full interview state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Interview'
    BadRequest:
      description: Missing or invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Invalid login credentials or missing/expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Interview does not exist or is not accessible to the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidState:
      description: Operation is unavailable in the interview's current status or mode
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AnswerSubmission:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, pattern: '\S'}
        selectedLanguage: {type: string, enum: [Python, Java, C++, JavaScript, TypeScript]}
    PlannedMessage:
      x-implementation-status: planned
      description: Follow-up metadata planned for issue 18. At most one follow-up per mainQuestionId; only main questions advance progress. Hints and answers retain their sender values.
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          required: [kind, mainQuestionId, mainQuestionNumber]
          properties:
            kind: {type: string, enum: [main, follow-up, answer, hint]}
            mainQuestionId: {type: string}
            mainQuestionNumber: {type: integer, minimum: 1, maximum: 15}
    HistoryQuery:
      x-implementation-status: implemented
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/Role'
        type: {type: string, enum: [Technical, Behavioral, Role-specific]}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        minScore: {type: number, minimum: 1, maximum: 10}
        maxScore: {type: number, minimum: 1, maximum: 10}
        search: {type: string}
        page: {type: integer, minimum: 1, default: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100, default: 20}
    HistoryPage:
      x-implementation-status: implemented
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Interview'
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
    PlannedScores:
      x-implementation-status: implemented
      description: Each unavailable or inapplicable category is null and excluded from averages. All-null categories produce no overall estimate.
      type: object
      required: [accuracy, completeness, clarity, structure]
      properties:
        accuracy: {type: number, minimum: 1, maximum: 10, nullable: true}
        completeness: {type: number, minimum: 1, maximum: 10, nullable: true}
        clarity: {type: number, minimum: 1, maximum: 10, nullable: true}
        structure: {type: number, minimum: 1, maximum: 10, nullable: true}
    EvidenceReference:
      type: object
      required: [interviewId, answerId]
      properties:
        interviewId: {type: string}
        answerId: {type: string}
    EvidenceClaim:
      type: object
      required: [text, sources]
      properties:
        text: {type: string}
        sources:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceReference'
    StudyQuestion:
      type: object
      required: [id, interviewId, questionId, prompt, note, savedAt]
      properties:
        id: {type: string}
        interviewId: {type: string}
        questionId: {type: string}
        prompt: {type: string}
        note: {type: string, maxLength: 4000}
        savedAt: {type: string, format: date-time}
    StudyPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/StudyQuestion'}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
    PracticeSuggestion:
      type: object
      required: [topic, setup, sources]
      properties:
        topic: {type: string, minLength: 1}
        setup:
          $ref: '#/components/schemas/InterviewSetup'
        sources:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EvidenceReference'
    DashboardGroup:
      type: object
      required: [role, type, mode, level, scoredCount, overall, scores, trends, suggestions]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        type: {type: string, enum: [Technical, Behavioral, Role-specific]}
        mode: {type: string, enum: [Practice, Real Interview]}
        level:
          $ref: '#/components/schemas/Level'
        scoredCount: {type: integer, minimum: 0}
        overall: {type: number, minimum: 1, maximum: 10, nullable: true}
        scores:
          $ref: '#/components/schemas/PlannedScores'
        suggestions:
          description: Up to three topics repeated in at least two completed scored interviews within this exact role/type/mode/starting-level group. Practice setup may use Practice mode even when source evidence is from Real Interview mode.
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/PracticeSuggestion'
        trends:
          type: array
          items:
            type: object
            required: [interviewId, date, overall]
            properties:
              interviewId: {type: string}
              date: {type: string, format: date-time}
              overall: {type: number, minimum: 1, maximum: 10}
    DashboardSummary:
      x-implementation-status: implemented
      type: object
      required: [completedCount, recentActivity, groups, strengths, weaknesses, suggestions]
      properties:
        completedCount: {type: integer, minimum: 0}
        recentActivity:
          type: array
          items:
            $ref: '#/components/schemas/Interview'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/DashboardGroup'
        strengths:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceClaim'
        weaknesses:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceClaim'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/PracticeSuggestion'
    Role:
      type: string
      enum: [Frontend Developer, Backend Developer, Full Stack Developer, Java Developer, Python Developer, C++ Developer, QA Engineer, Data Analyst, DevOps Engineer]
    Level:
      type: string
      enum: [Junior, Middle, Senior]
    User:
      type: object
      required: [id, name, email, targetRole, level, preferredLanguage]
      properties:
        id: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        targetRole:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/Level'
        preferredLanguage: {type: string, minLength: 1, maxLength: 80, pattern: '\S', description: Saved profile preference; each interview records its own supported language.}
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [name, targetRole, level]
      properties:
        name: {type: string, minLength: 1, pattern: '\S'}
        preferredLanguage: {type: string, minLength: 1, maxLength: 80, pattern: '\S', description: Omission preserves the saved preference.}
        targetRole:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/Level'
    RegisterData:
      type: object
      required: [name, email, password]
      properties:
        name: {type: string, minLength: 1, pattern: '\S'}
        email: {type: string, format: email}
        password: {type: string, minLength: 1, writeOnly: true}
        targetRole:
          description: Defaults to Frontend Developer when omitted.
          allOf:
            - $ref: '#/components/schemas/Role'
        level:
          description: Defaults to Middle when omitted.
          allOf:
            - $ref: '#/components/schemas/Level'
    InterviewSetup:
      type: object
      required: [role, level, mode, questionCount, type, input, language]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        level:
          $ref: '#/components/schemas/Level'
        mode: {type: string, enum: [Practice, Real Interview]}
        questionCount: {type: integer, enum: [5, 10, 15]}
        type: {type: string, enum: [Technical, Behavioral, Role-specific]}
        input: {type: string, enum: [Voice, Text]}
        language: {type: string, enum: [English, Russian]}
        jobDescription: {type: string}
        practiceTopic: {type: string, minLength: 1, maxLength: 120, pattern: '\S', nullable: true, description: Optional evidence-backed topic for Practice sessions; ignored when incompatible with role or type.}
    Message:
      type: object
      required: [id, interviewId, from, text, createdAt]
      properties:
        id: {type: string}
        interviewId: {type: string}
        from: {type: string, enum: [ai, you, hint]}
        text: {type: string}
        createdAt: {type: string, format: date-time}
        kind: {type: string, enum: [main, follow-up], default: main}
        mainQuestionId: {type: string, nullable: true, description: Main-question ID for a follow-up message; null for main questions.}
    DifficultyDecision:
      type: object
      required: [questionId, answerId, previousLevel, effectiveLevel, average, reason]
      properties:
        questionId: {type: string}
        answerId: {type: string}
        previousLevel:
          $ref: '#/components/schemas/Level'
        effectiveLevel:
          $ref: '#/components/schemas/Level'
        average: {type: number, minimum: 1, maximum: 10, nullable: true}
        reason: {type: string}
    Scores: &scoreSchema
      type: object
      required: [accuracy, completeness, clarity, structure]
      properties:
        accuracy: {type: number, minimum: 1, maximum: 10, nullable: true}
        completeness: {type: number, minimum: 1, maximum: 10, nullable: true}
        clarity: {type: number, minimum: 1, maximum: 10, nullable: true}
        structure: {type: number, minimum: 1, maximum: 10, nullable: true}
    NullableScores:
      <<: *scoreSchema
      nullable: true
    AnswerEvaluation: &evaluationSchema
      type: object
      required: [accuracy, completeness, clarity, structure, went_well, missing, stronger_answer]
      properties:
        accuracy: {type: number, minimum: 1, maximum: 10, nullable: true}
        completeness: {type: number, minimum: 1, maximum: 10, nullable: true}
        clarity: {type: number, minimum: 1, maximum: 10, nullable: true}
        structure: {type: number, minimum: 1, maximum: 10, nullable: true}
        went_well: {type: string}
        missing: {type: string}
        stronger_answer: {type: string}
    NullableAnswerEvaluation:
      <<: *evaluationSchema
      nullable: true
    Interview:
      type: object
      required: [id, setup, status, startedAt, endedAt, answeredCount, messages, lastFeedback]
      properties:
        id: {type: string}
        setup:
          $ref: '#/components/schemas/InterviewSetup'
        status: {type: string, enum: [active, complete, incomplete]}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time, nullable: true}
        answeredCount: {type: integer, minimum: 0}
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        lastFeedback:
          $ref: '#/components/schemas/NullableScores'
        lastAnswerFeedback:
          $ref: '#/components/schemas/NullableAnswerEvaluation'
        effectiveLevel:
          description: Persisted level used for future questions; the initial value equals setup.level.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Level'
        difficultyDecisions:
          type: array
          items:
            $ref: '#/components/schemas/DifficultyDecision'
    Feedback:
      type: object
      required: [interviewId, answeredQuestions, selectedQuestions, overall, scores, strengths, gaps, questions]
      properties:
        interviewId: {type: string}
        answeredQuestions: {type: integer, minimum: 0, description: Main questions answered in this session.}
        selectedQuestions: {type: integer, enum: [5, 10, 15], description: Main question count selected at setup.}
        overall: {type: number, minimum: 1, maximum: 10, nullable: true}
        scores:
          $ref: '#/components/schemas/NullableScores'
        strengths:
          type: array
          items: {type: string}
        gaps:
          type: array
          items: {type: string}
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionFeedback'
    QuestionFeedback:
      type: object
      required: [questionId, answerId, q, answer, score, good, miss, better]
      properties:
        questionId: {type: string, description: Saved transcript question message ID.}
        answerId: {type: string, description: Saved transcript answer message ID.}
        q: {type: string}
        answer: {type: string}
        score: {type: number, minimum: 1, maximum: 10, nullable: true}
        scores:
          $ref: '#/components/schemas/NullableScores'
        good: {type: string}
        miss: {type: string}
        better: {type: string}
    InterviewReport:
      type: object
      required: [interview, feedback]
      properties:
        interview:
          $ref: '#/components/schemas/Interview'
        feedback:
          $ref: '#/components/schemas/Feedback'
    CodeRunRequest:
      type: object
      additionalProperties: false
      required: [language, code]
      properties:
        language:
          type: string
          enum: [Python, Java, C++, JavaScript, TypeScript]
        code:
          type: string
          minLength: 1
          maxLength: 50000
    CodeRunResult:
      type: object
      additionalProperties: false
      required: [status, stdout, stderr]
      properties:
        status:
          type: string
          enum: [success, compile-error, runtime-error, timeout, output-limit, unavailable]
        stdout:
          type: string
          maxLength: 32768
        stderr:
          type: string
          maxLength: 32768
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable error suitable for display by the client.
